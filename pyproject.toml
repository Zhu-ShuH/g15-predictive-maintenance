[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "g15-predictive-maintenance"
version = "0.0.0"
description = "G15 predictive-maintenance simulation, analysis and reporting sandbox"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy",  # Reproducible environment versions are in requirements.lock.txt.
    "PyYAML",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py311", "py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pylint.main]
source-roots = ["src"]

[tool.pylint.format]
max-line-length = 88

[tool.setuptools.package-data]
"g15.console" = ["static/*.html", "static/*.css", "static/*.js", "static/*.svg", "static/*.png", "static/fonts/*"]
