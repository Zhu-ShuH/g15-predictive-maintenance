name: CI (skeleton checks only)

on:
  push:
  pull_request:

jobs:
  skeleton:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and current unpinned dependencies
        run: python -m pip install -e . -r requirements-dev.txt
      - name: Black (real check)
        run: python -m black --check src tests
      - name: Pylint (threshold 8.5)
        run: python -m pylint src/g15 --fail-under=8.5
      - name: Pytest (structural import test; no business tests yet)
        run: python -m pytest -q
      - name: Package import smoke test
        run: python -c "import g15; import g15.simulation; import g15.pipeline; import g15.analysis; import g15.storage; import g15.reporting; import g15.common"
